<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 全球教育创新案例库</title>
    <style>
        /* 复用样式，同上 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        header {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            color: white;
            padding: 2rem 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .logo i {
            font-size: 2.2rem;
            color: #4cc9f0;
        }
        
        .main-nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }
        
        .main-nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        
        .main-nav a:hover {
            opacity: 0.8;
        }
        
        .page-content {
            background: white;
            padding: 40px;
            margin: 40px 0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        .page-title {
            color: #4361ee;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid #4361ee;
        }
        
        footer {
            background: #1a1a1a;
            color: white;
            padding: 3rem 0;
            text-align: center;
            margin-top: 3rem;
        }
        
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        
        .contact-card {
            padding: 30px;
            background: #f0f7ff;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .contact-card:hover {
            transform: translateY(-5px);
        }
        
        .contact-card i {
            font-size: 2.5rem;
            color: #4361ee;
            margin-bottom: 15px;
        }
        
        .contact-form {
            margin-top: 40px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #4361ee;
        }
        
        .submit-btn {
            background: #4361ee;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .submit-btn:hover {
            background: #3a0ca3;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>全球教育创新案例库</span>
                </div>
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="about.html">关于我们</a></li>
                        <li><a href="contact.html">联系我们</a></li>
                        <li><a href="submission.html">投稿指南</a></li>
                        <li><a href="privacy.html">隐私政策</a></li>
                        <li><a href="terms.html">使用条款</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="page-content">
            <h1 class="page-title">联系我们</h1>
            
            <div class="contact-grid">
                <div class="contact-card">
                    <i class="fas fa-envelope"></i>
                    <h3>邮箱联系</h3>
                    <p style="margin: 15px 0;">项目负责人：游海洋</p>
                    <p style="color: #4361ee; font-weight: 600;">youhaiyang@stu.hbnu.edu.cn</p>
                </div>
                
                <div class="contact-card">
                    <i class="fas fa-phone"></i>
                    <h3>电话联系</h3>
                    <p style="margin: 15px 0;">项目咨询热线</p>
                    <p style="color: #4361ee; font-weight: 600;">(86) 0714-1234567</p>
                    <p style="font-size: 0.9rem; color: #666; margin-top: 10px;">工作日 9:00-18:00</p>
                </div>
                
                <div class="contact-card">
                    <i class="fas fa-map-marker-alt"></i>
                    <h3>办公地址</h3>
                    <p style="margin: 15px 0;">知行教育研究课题组</p>
                    <p style="color: #4361ee;">湖北省黄石市磁湖路11号</p>
                </div>
            </div>
            
            <!-- 政府合作联系专区 -->
            <div style="margin-top: 50px; padding: 30px; background: #e8f5e9; border-radius: 10px;">
                <h2 style="color: #2e7d32; margin-bottom: 20px;">
                    <i class="fas fa-handshake"></i> 政府合作联系
                </h2>
                <p>我们高度重视与各级政府的教育合作，以下是各合作单位的联系通道：</p>
                
                <div style="margin-top: 20px;">
                    <a href="government-contact.html" style="display: inline-block; padding: 12px 24px; background: #2e7d32; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">
                        <i class="fas fa-external-link-alt"></i> 查看政府合作联系详情
                    </a>
                </div>
            </div>
            
            <!-- 联系表单 -->
            <div class="contact-form">
                <h2 style="color: #4361ee; margin-bottom: 20px;">发送消息</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">姓名 *</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">邮箱 *</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">主题</label>
                        <input type="text" id="subject" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">消息内容 *</label>
                        <textarea id="message" class="form-control" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane"></i> 发送消息
                    </button>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 自2023创建-全球教育创新案例库. 保留所有权利.</p>
        </div>
    </footer>
    
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('感谢您的留言！我们会尽快与您联系。');
            this.reset();
        });
    </script>
</body>
</html>
